<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Entrar — Projeto Gerenciador</title>
  <script>
    (function () {
      var theme = window.localStorage.getItem('gerenciador_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">

  <button type="button" class="icon-btn theme-toggle-floating" data-theme-toggle aria-label="Alternar tema claro/escuro" style="background:rgba(255,255,255,0.15);color:#fff;">
    <i class="fa-solid fa-moon" aria-hidden="true"></i>
  </button>

  <div class="auth-card">
    <div class="auth-brand"><i class="fa-solid fa-layer-group"></i> Projeto Gerenciador</div>

    <div id="expiredAlert" class="alert alert-warning d-none py-2 small" role="alert">
      Sua sessao expirou. Faca login novamente.
    </div>
    <div id="loginError" class="alert alert-danger d-none py-2 small" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label small fw-bold" for="email">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" required autocomplete="email" placeholder="voce@exemplo.com">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold" for="password">Senha</label>
        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-bold py-2" id="loginBtn">
        Entrar
      </button>
    </form>

    <hr class="my-4">
    <p class="text-center small mb-0">
      Ainda nao tem conta? <a href="register.html">Cadastre-se</a>
    </p>

    <details class="mt-4 small text-muted">
      <summary style="cursor:pointer">Configuracao avancada</summary>
      <div class="mt-2">
        <label class="form-label small">URL da API</label>
        <input type="text" class="form-control form-control-sm" id="apiBaseUrlInput" placeholder="http://localhost:8000">
        <button type="button" class="btn btn-sm btn-outline-secondary mt-2" id="saveApiUrlBtn">Salvar</button>
      </div>
    </details>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/theme.js"></script>
  <script>
    Theme.bind();

    if (Api.isAuthenticated()) {
      window.location.href = 'index.html';
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get('expired')) {
      document.getElementById('expiredAlert').classList.remove('d-none');
    }

    const apiInput = document.getElementById('apiBaseUrlInput');
    apiInput.value = window.APP_CONFIG.API_BASE_URL.replace('/api', '');
    document.getElementById('saveApiUrlBtn').addEventListener('click', () => {
      const value = apiInput.value.trim().replace(/\/$/, '');
      if (value) {
        window.localStorage.setItem('api_base_url', value);
        window.location.reload();
      }
    });

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-inline"></span>';

      try {
        const payload = {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        };
        const data = await Api.post('/login', payload);
        Api.setSession(data.token, data.user);

        const next = params.get('next');
        window.location.href = next && next !== 'login.html' ? next : 'index.html';
      } catch (err) {
        errorBox.textContent = err.message || 'Nao foi possivel entrar. Verifique suas credenciais.';
        errorBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Entrar';
      }
    });
  </script>
</body>
</html>
