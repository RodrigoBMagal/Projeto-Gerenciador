<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Tarefas — Projeto Gerenciador</title>
  <script>
    (function () {
      var theme = window.localStorage.getItem('gerenciador_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div id="pageContent">
    <div class="page-header">
      <div>
        <h1>Tarefas</h1>
        <p>Cadastre e acompanhe as tarefas do time.</p>
      </div>
      <button class="btn btn-primary btn-sm" id="novaTarefaBtn"><i class="fa-solid fa-plus me-1"></i> Nova tarefa</button>
    </div>

    <div class="panel">
      <div class="table-toolbar">
        <div class="input-group search-box">
          <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted" aria-hidden="true"></i></span>
          <input type="text" class="form-control" id="tarefaSearch" placeholder="Filtrar por nome ou descricao..." aria-label="Filtrar tarefas">
        </div>

        <div class="filter-bar">
          <div class="dropdown">
            <button class="filter-chip" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="fa-solid fa-flag" aria-hidden="true"></i> Status/Prioridade
            </button>
            <div class="dropdown-menu dropdown-panel p-3">
              <label class="form-label d-block">Status</label>
              <select class="form-select form-select-sm mb-3" id="filtroStatus">
                <option value="">Todos</option>
                <option value="pendente">Pendente</option>
                <option value="em_andamento">Em andamento</option>
                <option value="concluida">Concluida</option>
              </select>
              <label class="form-label d-block">Prioridade</label>
              <select class="form-select form-select-sm mb-3" id="filtroPrioridade">
                <option value="">Todas</option>
                <option value="baixa">Baixa</option>
                <option value="media">Media</option>
                <option value="alta">Alta</option>
              </select>
              <label class="form-label d-block">De</label>
              <input type="date" class="form-control form-control-sm mb-2" id="filtroDataDe">
              <label class="form-label d-block">Ate</label>
              <input type="date" class="form-control form-control-sm mb-3" id="filtroDataAte">
              <button type="button" class="btn btn-sm btn-outline-secondary w-100" id="limparFiltros">Limpar filtros</button>
            </div>
          </div>
          <div class="text-muted small" id="tarefaCount"></div>
        </div>
      </div>

      <div class="table-scroll">
        <table class="table app-table align-middle mb-0">
          <thead>
            <tr>
              <th class="sortable" data-sort-key="nome">Nome <i class="fa-solid fa-sort"></i></th>
              <th class="sortable" data-sort-key="data">Data <i class="fa-solid fa-sort"></i></th>
              <th class="sortable" data-sort-key="status">Status <i class="fa-solid fa-sort"></i></th>
              <th class="sortable" data-sort-key="prioridade">Prioridade <i class="fa-solid fa-sort"></i></th>
              <th>Descricao</th>
              <th class="text-end">Acoes</th>
            </tr>
          </thead>
          <tbody id="tarefasTbody"></tbody>
        </table>
      </div>

      <div id="tarefasEmpty"></div>
      <nav class="app-pagination" id="tarefasPagination" aria-label="Paginacao de tarefas"></nav>
    </div>
  </div>

  <!-- Modal: criar/editar tarefa -->
  <div class="modal fade" id="tarefaModal" tabindex="-1">
    <div class="modal-dialog modal-fullscreen-sm-down">
      <div class="modal-content">
        <form id="tarefaForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="tarefaModalTitle">Nova tarefa</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" name="id" id="tarefaId">
            <div class="mb-3">
              <label class="form-label small fw-bold" for="tarefaNome">Nome</label>
              <input type="text" class="form-control" name="nome" id="tarefaNome" required maxlength="255" autocomplete="off">
              <div class="field-hint neutral" id="tarefaNomeHint"></div>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold" for="tarefaData">Data</label>
                <input type="date" class="form-control" name="data" id="tarefaData" required>
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-bold" for="tarefaStatus">Status</label>
                <select class="form-select" name="status" id="tarefaStatus">
                  <option value="pendente">Pendente</option>
                  <option value="em_andamento">Em andamento</option>
                  <option value="concluida">Concluida</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-bold" for="tarefaPrioridade">Prioridade</label>
                <select class="form-select" name="prioridade" id="tarefaPrioridade">
                  <option value="baixa">Baixa</option>
                  <option value="media">Media</option>
                  <option value="alta">Alta</option>
                </select>
              </div>
            </div>
            <div class="mb-1 mt-3">
              <label class="form-label small fw-bold" for="tarefaDescricao">Descricao</label>
              <textarea class="form-control" name="descricao" id="tarefaDescricao" rows="3" maxlength="2000"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="tarefaSubmitBtn">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/tarefas.js"></script>
</body>
</html>
