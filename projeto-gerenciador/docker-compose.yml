version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gerenciador_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-gerenciador}
      - DB_USERNAME=${DB_USERNAME:-gerenciador}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gerenciador

  redis:
    image: redis:7-alpine
    container_name: gerenciador_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gerenciador_redis_data:/data
    networks:
      - gerenciador

  webserver:
    image: nginx:1.27-alpine
    container_name: gerenciador_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - gerenciador

  db:
    image: mysql:8.0
    container_name: gerenciador_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gerenciador}
      MYSQL_USER: ${DB_USERNAME:-gerenciador}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "3306:3306"
    volumes:
      - gerenciador_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gerenciador

  phpmyadmin:
    image: phpmyadmin:5
    container_name: gerenciador_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USERNAME:-gerenciador}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - gerenciador

networks:
  gerenciador:
    driver: bridge

volumes:
  gerenciador_db_data:
  gerenciador_redis_data:
