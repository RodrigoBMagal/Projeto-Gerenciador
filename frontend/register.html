<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Criar conta — Projeto Gerenciador</title>
  <script>
    (function () {
      var theme = window.localStorage.getItem('gerenciador_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">

  <button type="button" class="icon-btn theme-toggle-floating" data-theme-toggle aria-label="Alternar tema claro/escuro" style="background:rgba(255,255,255,0.15);color:#fff;">
    <i class="fa-solid fa-moon" aria-hidden="true"></i>
  </button>

  <div class="auth-card">
    <div class="auth-brand"><i class="fa-solid fa-layer-group"></i> Projeto Gerenciador</div>

    <div id="registerError" class="alert alert-danger d-none py-2 small" role="alert"></div>

    <form id="registerForm" novalidate>
      <div class="mb-3">
        <label class="form-label small fw-bold" for="name">Nome</label>
        <input type="text" class="form-control" id="name" name="name" required autocomplete="name" placeholder="Seu nome completo">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold" for="email">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" required autocomplete="email" placeholder="voce@exemplo.com">
        <div class="field-hint neutral" id="emailHint"></div>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold" for="password">Senha</label>
        <input type="password" class="form-control" id="password" name="password" required autocomplete="new-password" placeholder="Minimo de 8 caracteres">
        <div class="field-hint neutral" id="passwordHint">Minimo de 8 caracteres.</div>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold" for="password_confirmation">Confirmar senha</label>
        <input type="password" class="form-control" id="password_confirmation" name="password_confirmation" required autocomplete="new-password" placeholder="Repita a senha">
        <div class="field-hint neutral" id="confirmHint"></div>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-bold py-2" id="registerBtn">
        Criar conta
      </button>
    </form>

    <hr class="my-4">
    <p class="text-center small mb-0">
      Ja tem conta? <a href="login.html">Entrar</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/theme.js"></script>
  <script>
    Theme.bind();

    if (Api.isAuthenticated()) {
      window.location.href = 'index.html';
    }

    const emailInput = document.getElementById('email');
    const emailHint = document.getElementById('emailHint');
    const passwordInput = document.getElementById('password');
    const passwordHint = document.getElementById('passwordHint');
    const confirmInput = document.getElementById('password_confirmation');
    const confirmHint = document.getElementById('confirmHint');

    // Validacao em tempo real, sem esperar o submit.
    emailInput.addEventListener('input', () => {
      const valido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim());
      if (!emailInput.value) { emailHint.className = 'field-hint neutral'; emailHint.textContent = ''; return; }
      emailHint.className = `field-hint ${valido ? 'ok' : 'bad'}`;
      emailHint.innerHTML = valido
        ? '<i class="fa-solid fa-circle-check"></i> E-mail valido'
        : '<i class="fa-solid fa-circle-xmark"></i> Formato de e-mail invalido';
    });

    function checarSenha() {
      const tamanhoOk = passwordInput.value.length >= 8;
      if (!passwordInput.value) {
        passwordHint.className = 'field-hint neutral';
        passwordHint.textContent = 'Minimo de 8 caracteres.';
      } else {
        passwordHint.className = `field-hint ${tamanhoOk ? 'ok' : 'bad'}`;
        passwordHint.innerHTML = tamanhoOk
          ? '<i class="fa-solid fa-circle-check"></i> Tamanho adequado'
          : '<i class="fa-solid fa-circle-xmark"></i> Use pelo menos 8 caracteres';
      }
      checarConfirmacao();
    }

    function checarConfirmacao() {
      if (!confirmInput.value) { confirmHint.className = 'field-hint neutral'; confirmHint.textContent = ''; return; }
      const igual = confirmInput.value === passwordInput.value;
      confirmHint.className = `field-hint ${igual ? 'ok' : 'bad'}`;
      confirmHint.innerHTML = igual
        ? '<i class="fa-solid fa-circle-check"></i> As senhas coincidem'
        : '<i class="fa-solid fa-circle-xmark"></i> As senhas nao coincidem';
    }

    passwordInput.addEventListener('input', checarSenha);
    confirmInput.addEventListener('input', checarConfirmacao);

    const form = document.getElementById('registerForm');
    const errorBox = document.getElementById('registerError');
    const btn = document.getElementById('registerBtn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-inline"></span>';

      try {
        const payload = {
          name: document.getElementById('name').value.trim(),
          email: emailInput.value.trim(),
          password: passwordInput.value,
          password_confirmation: confirmInput.value,
        };
        const data = await Api.post('/register', payload);
        Api.setSession(data.token, data.user);
        window.location.href = 'index.html';
      } catch (err) {
        if (err.errors) {
          const firstField = Object.keys(err.errors)[0];
          errorBox.textContent = err.errors[firstField][0];
        } else {
          errorBox.textContent = err.message || 'Nao foi possivel criar a conta.';
        }
        errorBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Criar conta';
      }
    });
  </script>
</body>
</html>
