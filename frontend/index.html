<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Dashboard — Projeto Gerenciador</title>
  <script>
    (function () {
      var theme = window.localStorage.getItem('gerenciador_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- O Layout.mount() injeta sidebar/topbar e move este bloco para dentro de #pageContent -->
  <div id="pageContent">
    <div class="page-header">
      <div>
        <h1>Dashboard</h1>
        <p>Visao geral das tarefas e da equipe.</p>
      </div>
      <a href="tarefas.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus me-1"></i> Nova tarefa</a>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-xl col-md-6 col-sm-6">
        <div class="stat-card fade-in fade-in-1">
          <div class="icon-wrap"><i class="fa-solid fa-list-check"></i></div>
          <div>
            <div class="label">Total de tarefas</div>
            <div class="value" id="statTotal">—</div>
          </div>
        </div>
      </div>
      <div class="col-xl col-md-6 col-sm-6">
        <div class="stat-card warning fade-in fade-in-2">
          <div class="icon-wrap"><i class="fa-solid fa-hourglass-half"></i></div>
          <div>
            <div class="label">Pendentes</div>
            <div class="value" id="statPendente">—</div>
          </div>
        </div>
      </div>
      <div class="col-xl col-md-6 col-sm-6">
        <div class="stat-card info fade-in fade-in-3">
          <div class="icon-wrap"><i class="fa-solid fa-spinner"></i></div>
          <div>
            <div class="label">Em andamento</div>
            <div class="value" id="statEmAndamento">—</div>
          </div>
        </div>
      </div>
      <div class="col-xl col-md-6 col-sm-6">
        <div class="stat-card success fade-in fade-in-4">
          <div class="icon-wrap"><i class="fa-solid fa-circle-check"></i></div>
          <div>
            <div class="label">Concluidas</div>
            <div class="value" id="statConcluida">—</div>
          </div>
        </div>
      </div>
      <div class="col-xl col-md-6 col-sm-6">
        <div class="stat-card danger fade-in fade-in-4">
          <div class="icon-wrap"><i class="fa-solid fa-triangle-exclamation"></i></div>
          <div>
            <div class="label">Atrasadas</div>
            <div class="value" id="statAtrasada">—</div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="stat-card fade-in fade-in-1">
          <div class="icon-wrap"><i class="fa-solid fa-users"></i></div>
          <div>
            <div class="label">Membros da equipe</div>
            <div class="value" id="statStaffTotal">—</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card info fade-in fade-in-2">
          <div class="icon-wrap"><i class="fa-solid fa-link"></i></div>
          <div>
            <div class="label">Com tarefa atribuida</div>
            <div class="value" id="statStaffComTarefa">—</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card fade-in fade-in-3">
          <div class="icon-wrap"><i class="fa-solid fa-user-slash"></i></div>
          <div>
            <div class="label">Sem tarefa atribuida</div>
            <div class="value" id="statStaffSemTarefa">—</div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="panel h-100">
          <div class="panel-title"><i class="fa-solid fa-clock"></i> Proximas tarefas</div>
          <div id="proximasTarefas"></div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="panel h-100">
          <div class="panel-title"><i class="fa-solid fa-chart-pie"></i> Equipe por contrato</div>
          <canvas id="contratoChart" height="200"></canvas>
          <div id="contratoChartEmpty" class="d-none"></div>
        </div>
      </div>
      <div class="col-12">
        <div class="panel">
          <div class="panel-title"><i class="fa-solid fa-chart-column"></i> Tarefas cadastradas por mes</div>
          <canvas id="evolucaoChart" height="90"></canvas>
          <div id="evolucaoChartEmpty" class="d-none"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
